<!DOCTYPE html>
<html lang="en" data-style="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<title>Picboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ================= Style themes (site chrome) ================= */
:root{
  --danger:#ff6b6b;
  --font:"Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --hand:"Caveat", "Comic Sans MS", cursive;
}
html[data-style="midnight"]{
  --bg:#0e1014; --surface:#171a21; --surface-2:#1f232c; --surface-3:#282d38; --line:#2a2f3a;
  --text:#e9ecf2; --muted:#98a0b0; --accent:#8aa4ff; --accent-ink:#0d1020; --accent-soft:rgba(138,164,255,.16);
  --shadow:0 14px 40px rgba(0,0,0,.45); --tilt:0; color-scheme:dark;
}
html[data-style="cozy"]{
  --bg:#1b1512; --surface:#251d18; --surface-2:#30261f; --surface-3:#3a2e26; --line:#40332a;
  --text:#f5ebe0; --muted:#bba796; --accent:#f2a65a; --accent-ink:#2a1a0e; --accent-soft:rgba(242,166,90,.16);
  --shadow:0 14px 40px rgba(0,0,0,.45); --tilt:1; color-scheme:dark;
}
html[data-style="cork"]{
  --bg:#17120d; --surface:#211a13; --surface-2:#2b2219; --surface-3:#352a1f; --line:#3d3125;
  --text:#f3eadf; --muted:#b5a48f; --accent:#ef6f5e; --accent-ink:#1e0f0b; --accent-soft:rgba(239,111,94,.16);
  --shadow:0 14px 40px rgba(0,0,0,.5); --tilt:1; color-scheme:dark;
}
html[data-style="blackboard"]{
  --bg:#0f1512; --surface:#16201b; --surface-2:#1e2b24; --surface-3:#26352d; --line:#2c3b33;
  --text:#eef4ef; --muted:#9db3a6; --accent:#9be3b6; --accent-ink:#0f1a14; --accent-soft:rgba(155,227,182,.15);
  --shadow:0 14px 40px rgba(0,0,0,.5); --tilt:1; color-scheme:dark;
}
html[data-style="whiteboard"]{
  --bg:#eef0f4; --surface:#ffffff; --surface-2:#f3f4f7; --surface-3:#e8eaef; --line:#dde1e8;
  --text:#1c2030; --muted:#687083; --accent:#3b6cf6; --accent-ink:#ffffff; --accent-soft:rgba(59,108,246,.12);
  --shadow:0 12px 34px rgba(30,40,70,.14); --tilt:.35; color-scheme:light;
}

/* ================= Board surfaces ================= */
.surf-midnight{
  background-color:#161922;
  background-image:radial-gradient(circle, rgba(255,255,255,.08) 0 1.2px, transparent 1.8px);
  background-size:28px 28px;
}
.surf-cozy{
  background-color:#efe2cc;
  background-image:
    repeating-linear-gradient(0deg, rgba(110,80,50,.07) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(90deg, rgba(110,80,50,.06) 0 1px, transparent 1px 5px);
}
.surf-cork{
  background-color:#b8885a;
  background-image:
    radial-gradient(circle, rgba(60,32,10,.45) 0 1px, transparent 1.6px),
    radial-gradient(circle, rgba(255,232,190,.35) 0 1px, transparent 1.6px),
    radial-gradient(circle, rgba(95,58,25,.28) 0 2px, transparent 3.2px),
    radial-gradient(circle, rgba(255,240,215,.10) 0 8px, transparent 14px);
  background-size:7px 7px, 11px 11px, 23px 23px, 90px 90px;
}
.surf-blackboard{
  background-color:#25392e;
  background-image:
    radial-gradient(ellipse 600px 300px at 20% 30%, rgba(255,255,255,.05), transparent 70%),
    radial-gradient(ellipse 500px 260px at 70% 65%, rgba(255,255,255,.04), transparent 70%),
    radial-gradient(circle, rgba(255,255,255,.035) 0 1px, transparent 1.5px);
  background-size:1400px 900px, 1300px 1000px, 9px 9px;
}
.surf-whiteboard{
  background-color:#fcfcfd;
  background-image:
    linear-gradient(rgba(40,70,140,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(40,70,140,.05) 1px, transparent 1px);
  background-size:48px 48px;
}

/* ================= Base ================= */
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%; margin:0}
body{font-family:var(--font); background:var(--bg); color:var(--text); overflow:hidden; -webkit-font-smoothing:antialiased}
.page{position:fixed; inset:0}
i[data-ic]{display:inline-flex; font-style:normal}
.ic{flex:none; display:block}
.muted{color:var(--muted)}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 15px;
  border-radius:11px; border:1px solid var(--line); background:var(--surface-2); color:var(--text);
  font:inherit; font-weight:800; font-size:14px; cursor:pointer; text-decoration:none; white-space:nowrap;
  transition:background .15s, border-color .15s, transform .1s, filter .15s;
}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5; cursor:default}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.icon{width:40px; padding:0}
.btn.sm{height:34px; padding:0 11px; font-size:13px; border-radius:9px}
.btn.sm.icon{width:34px; padding:0}
.inp,.sel{
  font:inherit; font-weight:700; font-size:14px; color:var(--text);
  background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
}
.inp{width:100%; padding:10px 12px}
.sel{height:40px; padding:0 12px; cursor:pointer}
.inp:focus,.sel:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.inp.num{width:110px}
.switch{display:inline-flex; align-items:center; gap:9px; cursor:pointer; font-weight:800; font-size:14px; position:relative; user-select:none; white-space:nowrap}
.switch input{position:absolute; opacity:0; width:1px; height:1px}
.switch .track{width:38px; height:22px; border-radius:999px; background:var(--surface-3); position:relative; transition:background .2s; flex:none}
.switch .track::after{content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent); outline-offset:2px}
.sw-dot{display:inline-block; width:18px; height:18px; border-radius:6px; border:1px solid var(--line); flex:none}
.swatch{width:26px; height:26px; border-radius:50%; border:2px solid rgba(0,0,0,.25); background:var(--c); cursor:pointer; padding:0; flex:none}
.swatch.on{outline:2px solid var(--accent); outline-offset:2px}

/* ================= Home ================= */
#home{overflow-y:auto; background:radial-gradient(1100px 520px at 50% -12%, var(--accent-soft), transparent 70%), var(--bg)}
.nav{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 24px 12px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
}
.logo{display:flex; align-items:center; gap:10px; font-weight:900; font-size:19px; color:var(--text); text-decoration:none; margin-right:auto}
.logo-mark{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:var(--accent); color:var(--accent-ink); transform:rotate(-6deg)}
.wrap{max-width:1180px; margin:0 auto; padding:0 24px calc(40px + env(safe-area-inset-bottom,0px))}
.hero{padding:54px 0 26px}
.hero h1{margin:0 0 12px; font-size:clamp(40px, 6vw, 66px); font-weight:900; letter-spacing:-1.5px; line-height:1.02}
.hero h1 em{font-style:normal; color:var(--accent); font-family:var(--hand); font-size:1.15em; letter-spacing:0}
.hero p{margin:0 0 20px; max-width:560px; font-size:17px; line-height:1.5; font-weight:600; color:var(--muted)}
.stat-chips{display:flex; flex-wrap:wrap; gap:8px}
.stat-chip{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-weight:800; font-size:13px; color:var(--muted)}
.stat-chip b{color:var(--text)}
.controls{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:10px 0 14px}
.search{flex:1; min-width:220px; display:flex; align-items:center; gap:10px; height:44px; padding:0 14px; border-radius:12px; background:var(--surface); border:1px solid var(--line); color:var(--muted)}
.search:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1; min-width:0; background:none; border:0; outline:none; color:var(--text); font:inherit; font-weight:700; font-size:15px}
.controls .sel{height:44px; background:var(--surface); border-radius:12px}
.chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:18px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; height:34px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font:inherit; font-weight:800; font-size:13px; cursor:pointer}
.chip:hover{color:var(--text)}
.chip.active{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:18px}
.loading{grid-column:1 / -1; text-align:center; padding:40px 0; color:var(--muted); font-weight:700}
.room-card{
  position:relative; display:flex; flex-direction:column; overflow:hidden; border-radius:16px;
  background:var(--surface); border:1px solid var(--line); color:inherit; text-decoration:none;
  transition:transform .18s, border-color .18s, box-shadow .18s;
}
.room-card:hover{transform:translateY(-3px); border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow:var(--shadow)}
.thumb{position:relative; aspect-ratio:16/9; overflow:hidden}
.thumb-ov{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  background:rgba(10,12,16,.55); color:#fff; font-weight:800; font-size:13px; text-align:center; padding:0 10px;
}
.thumb-ov.soft{background:rgba(10,12,16,.22); text-shadow:0 1px 3px rgba(0,0,0,.6)}
.mini{position:absolute; width:28%; transform:rotate(var(--r))}
.mini.media{background:#fdfcf8; padding:3%; box-shadow:0 3px 8px rgba(0,0,0,.3)}
.mini.media img,.mini.media video{display:block; width:100%; aspect-ratio:4/3; object-fit:cover; background:#ccc}
.mini.note{background:var(--nc); color:#2a2420; font-family:var(--hand); font-size:14px; line-height:1.05; padding:6px 8px; border-radius:10px; max-height:60%; overflow:hidden; box-shadow:0 3px 8px rgba(0,0,0,.25)}
.rc-body{padding:13px 15px 15px; display:flex; flex-direction:column; gap:6px}
.rc-name{font-weight:900; font-size:16px}
.rc-desc{font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rc-meta{display:flex; flex-wrap:wrap; gap:12px; font-size:12.5px; font-weight:800; color:var(--muted)}
.rc-meta span{display:inline-flex; align-items:center; gap:5px}
.badges{display:flex; flex-wrap:wrap; gap:6px}
.badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted)}
.badge.accent{background:var(--accent-soft); color:var(--accent)}
.rc-del{
  position:absolute; top:8px; right:8px; z-index:2; width:30px; height:30px; border-radius:9px; border:0;
  display:grid; place-items:center; cursor:pointer; background:rgba(0,0,0,.55); color:#fff; opacity:0; transition:opacity .15s, background .15s;
}
.room-card:hover .rc-del,.rc-del:focus-visible{opacity:1}
.rc-del:hover{background:var(--danger)}
@media (hover:none){ .rc-del{opacity:1} }
.home-empty{text-align:center; padding:40px 0}
.home-empty p{color:var(--muted); font-weight:700; margin:0 0 12px}
.foot{margin-top:40px; text-align:center; font-size:13px; font-weight:700; color:var(--muted); line-height:1.6}

/* ================= Modals ================= */
.modal{position:fixed; inset:0; z-index:60; display:flex;
